<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGradient)"/>

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8"/>

  <!-- Main Icon Shape: Stylized Upward Arrow / Rising Element -->
  <g transform="translate(256, 256)">
    <!-- Base platform -->
    <rect x="-80" y="60" width="160" height="30" rx="8" fill="rgba(255,255,255,0.95)"/>
    
    <!-- Rising bar chart elements -->
    <rect x="-60" y="-20" width="30" height="80" rx="6" fill="url(#accentGradient)"/>
    <rect x="-10" y="-80" width="30" height="140" rx="6" fill="url(#accentGradient)"/>
    <rect x="40" y="-50" width="30" height="110" rx="6" fill="url(#accentGradient)"/>
    
    <!-- Rising arrow on top -->
    <path d="M 0 -130 L -30 -80 L -10 -80 L -10 -20 L 10 -20 L 10 -80 L 30 -80 Z" fill="rgba(255,255,255,0.95)"/>
    
    <!-- Decorative circles (students) -->
    <circle cx="-80" cy="100" r="8" fill="rgba(255,255,255,0.8)"/>
    <circle cx="-40" cy="100" r="8" fill="rgba(255,255,255,0.8)"/>
    <circle cx="0" cy="100" r="8" fill="rgba(255,255,255,0.8)"/>
    <circle cx="40" cy="100" r="8" fill="rgba(255,255,255,0.8)"/>
    <circle cx="80" cy="100" r="8" fill="rgba(255,255,255,0.8)"/>
  </g>

  <!-- Text Arc (optional, subtle) -->
  <path id="textPath" d="M 80,256 A 176,176 0 0,1 432,256" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="28" font-weight="bold" letter-spacing="4" fill="rgba(255,255,255,0.8)">
    <textPath href="#textPath" startOffset="50%" text-anchor="middle">
      RAISE ME
    </textPath>
  </text>
</svg>
